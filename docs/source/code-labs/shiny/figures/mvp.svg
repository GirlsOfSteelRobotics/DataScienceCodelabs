<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>

  <!-- User -->
  <g stroke="#555" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="50" cy="112" r="16"/>
    <line x1="50" y1="128" x2="50" y2="170"/>
    <line x1="28" y1="145" x2="72" y2="145"/>
    <line x1="50" y1="170" x2="32" y2="200"/>
    <line x1="50" y1="170" x2="68" y2="200"/>
  </g>
  <text x="50" y="228" text-anchor="middle" font-size="16" fill="#333">User</text>

  <!-- User <-> View -->
  <line x1="80" y1="150" x2="126" y2="150" stroke="#555" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- View -->
  <rect x="130" y="70" width="180" height="160" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2.5"/>
  <text x="220" y="105" text-anchor="middle" font-size="22" font-weight="bold" fill="#4527a0">View</text>
  <text x="220" y="132" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace" fill="#333">app_ui</text>
  <text x="220" y="170" text-anchor="middle" font-size="13" fill="#555">combo boxes, sliders,</text>
  <text x="220" y="188" text-anchor="middle" font-size="13" fill="#555">empty spots for plots</text>

  <!-- View <-> Presenter -->
  <line x1="312" y1="120" x2="406" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="359" y="110" text-anchor="middle" font-size="13" fill="#333">inputs</text>
  <line x1="408" y1="180" x2="314" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="361" y="204" text-anchor="middle" font-size="13" fill="#333">plots</text>

  <!-- Presenter -->
  <rect x="410" y="70" width="180" height="160" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="500" y="105" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">Presenter</text>
  <text x="500" y="132" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace" fill="#333">server</text>
  <text x="500" y="170" text-anchor="middle" font-size="13" fill="#555">reads inputs, queries</text>
  <text x="500" y="188" text-anchor="middle" font-size="13" fill="#555">the data, makes plots</text>

  <!-- Presenter <-> Model -->
  <line x1="592" y1="120" x2="686" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="639" y="110" text-anchor="middle" font-size="13" fill="#333">pandas query</text>
  <line x1="688" y1="180" x2="594" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="641" y="204" text-anchor="middle" font-size="13" fill="#333">DataFrame</text>

  <!-- Model -->
  <rect x="690" y="70" width="180" height="160" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
  <text x="780" y="105" text-anchor="middle" font-size="22" font-weight="bold" fill="#00695c">Model</text>
  <text x="780" y="132" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace" fill="#333">df</text>
  <text x="780" y="170" text-anchor="middle" font-size="13" fill="#555">the scouted data,</text>
  <text x="780" y="188" text-anchor="middle" font-size="13" fill="#555">loaded with pandas</text>

  <!-- Footnote -->
  <text x="500" y="275" text-anchor="middle" font-size="13" fill="#777">The View and the Model never talk to each other. Everything goes through the Presenter.</text>
</svg>
